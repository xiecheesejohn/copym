[package]
name = "copym"
version = "0.2.2"
edition = "2024"
description = "A fast, modern, cross-platform clipboard manager"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xiecheesejohn/copym"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[workspace]
members = ["crates/copym-core", "crates/copym-sync", "crates/copym-android"]

[dependencies]
copym-core = { path = "crates/copym-core" }
copym-sync = { path = "crates/copym-sync" }
arboard = "3.7.0"
global-hotkey = "0.10.0"
dirs = "7.0.0"
skrifa = "0.44.0"
sys-locale = "0.3.2"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
interprocess = "2.4.9"
postcard = { version = "1.1.3", features = ["use-std"] }
regex-lite = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.2.1"
toml_edit = "0.25.19"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14.0", features = ["xfixes", "xtest"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
tract-onnx = { version = "0.23.10", default-features = false }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Globalization", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Time", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
objc2 = "0.6.5"
dispatch2 = "0.3.0"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray", "NSData", "NSDictionary", "NSError"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFString", "CFURL"] }
objc2-core-text = { version = "0.3.2", features = ["CTFont", "CTFontDescriptor"] }
objc2-vision = { version = "0.3.2", features = ["VNRequestHandler", "VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNTypes"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
