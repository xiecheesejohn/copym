[package]
name = "copym-sync"
version = "0.1.0"
edition = "2024"
description = "End-to-end encrypted LAN clipboard sync core for copym (platform independent, reusable on Android)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xiecheesejohn/copym"

[dependencies]
copym-core = { path = "../copym-core" }
getrandom = "0.4.3"
mdns-sd = "0.22.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver-crypto"] }
spake2 = "0.4.0"
