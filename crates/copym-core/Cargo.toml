[package]
name = "copym-core"
version = "0.1.0"
edition = "2024"
description = "History store and content model shared by copym desktop and Android"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xiecheesejohn/copym"

[dependencies]
png = "0.18.1"
postcard = { version = "1.1.3", features = ["use-std"] }
redb = "5.0.0"
regex-lite = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
