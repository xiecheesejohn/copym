[package]
name = "copym-core"
version = "0.2.1"
edition = "2024"
description = "History store and content model shared by copym desktop and Android"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xiecheesejohn/copym"

[dependencies]
lz4_flex = { version = "0.14", default-features = false, features = ["safe-encode", "safe-decode", "std"] }
png = "0.18.1"
postcard = { version = "1.1.3", features = ["use-std"] }
regex-lite = "0.1.9"
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.2.1"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
