[package]
name = "copym-android"
version = "0.2.3"
edition = "2024"
description = "JNI library behind the copym Android app (history store + encrypted LAN sync)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xiecheesejohn/copym"
publish = false

[lib]
name = "copym_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
copym-core = { path = "../copym-core" }
copym-sync = { path = "../copym-sync" }
jni = "0.21.1"
sys-locale = "0.3.2"
serde_json = "1.0.154"
