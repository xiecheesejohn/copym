name: CI

on:
  push:
    branches: [main]
    # pushing a version tag (v0.2.0) also publishes a GitHub Release, see `release`
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: copym-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: copym-windows-x86_64
          # Apple Silicon only for now (macos-latest runners are arm64).
          - os: macos-latest
            target: aarch64-apple-darwin
            name: copym-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test --workspace
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (file name carries OS and architecture)
        shell: bash
        run: |
          mkdir dist
          bin="target/${{ matrix.target }}/release/copym"
          if [ "${{ runner.os }}" = macOS ]; then
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            packaging/macos/make-dmg.sh "$bin" "$version" "dist/${{ matrix.name }}.dmg"
          elif [ "${{ runner.os }}" = Windows ]; then
            cp "$bin.exe" "dist/${{ matrix.name }}.exe"
          else
            cp "$bin" "dist/${{ matrix.name }}"
          fi
          ls -l dist
      - name: Check the DMG
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/copym-dmg dist/*.dmg
          ls -la /tmp/copym-dmg
          file /tmp/copym-dmg/copym.app/Contents/MacOS/copym
          /tmp/copym-dmg/copym.app/Contents/MacOS/copym version
          codesign --verify --deep --strict /tmp/copym-dmg/copym.app
          hdiutil detach /tmp/copym-dmg
      - name: Chinese OCR (built-in PP-OCR)
        if: runner.os == 'Linux'
        run: |
          out=$(target/${{ matrix.target }}/release/copym ocr tests/ocr-zh.png)
          echo "$out"
          echo "$out" | grep -q "验证码" && echo "$out" | grep -q "482913"
      - name: Chinese OCR (Apple Vision)
        if: runner.os == 'macOS'
        run: |
          out=$(target/${{ matrix.target }}/release/copym ocr tests/ocr-zh.png)
          echo "$out"
          echo "$out" | grep -q "验证码" && echo "$out" | grep -q "482913"
      - name: OCR (Windows.Media.Ocr, informational)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: target/${{ matrix.target }}/release/copym.exe ocr tests/ocr-zh.png
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install cargo-ndk and NDK
        run: |
          cargo install cargo-ndk --locked
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --console=plain
      - name: Name APKs by architecture
        run: |
          mkdir dist
          for f in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "dist/copym-android-$abi.apk"
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: copym-android
          path: dist/*.apk

  # On a version tag: attach every build to a GitHub Release
  # (stable download link: https://github.com/xiecheesejohn/copym/releases/latest).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the version in Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect files
        run: |
          mkdir release
          # artifacts lose the executable bit; ship the Linux binary in a tarball
          chmod +x artifacts/copym-linux-x86_64
          tar -C artifacts -czf release/copym-linux-x86_64.tar.gz copym-linux-x86_64
          cp artifacts/*.exe artifacts/*.dmg artifacts/*.apk release/
          ls -l release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "copym ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
