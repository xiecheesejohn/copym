name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: copym-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: copym-windows-x86_64
          # Apple Silicon only for now (macos-latest runners are arm64).
          - os: macos-latest
            target: aarch64-apple-darwin
            name: copym-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test --workspace
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (binary name carries OS and architecture)
        shell: bash
        run: |
          mkdir dist
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/copym$ext" "dist/${{ matrix.name }}$ext"
          file "dist/${{ matrix.name }}$ext" || true
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install cargo-ndk and NDK
        run: |
          cargo install cargo-ndk --locked
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --console=plain
      - name: Name APKs by architecture
        run: |
          mkdir dist
          for f in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "dist/copym-android-$abi.apk"
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: copym-android
          path: dist/*.apk
